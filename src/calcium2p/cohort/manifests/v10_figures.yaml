# V10 manuscript figure manifest -- the recovered recipe of every published
# comparison figure that the reproduction matched data-exactly.
#
# Recovered by re-running the original notebooks verbatim and recording the
# notebook state at each figure's save time. Every entry was validated against
# its original SVG; re-validate before editing by hand.
#
# Each state is one notebook configuration (one modulation window, one set of
# switches); the notebooks were re-run with different switches between saves,
# so a single run cannot reproduce them all. Recovered differences between
# states: modulated vs active ROIs, the statistical test (and paired vs
# unpaired), the passive_dendrites window (5.1-6.1 s for the earlier saves,
# 5.1-6.2 s later), and one normalized onset figure measured from reward time.
# y-limits are read from each original SVG's tick marks.
#
# Load with calcium2p.core.cohort_config.load_figure_manifest().

defaults:
  legacy_faithful: true
  event_source: reference
  data_subdir: manuscript/V10
  fps_by_cohort:
    task_axons: 30.54
    NO_DREADDs: 30.3
    passive: 30.54
    default: 30.3
  notes: 'Excluded (not reproduced): non-consecutive-normalized Passive axons cRew vs. cHIT early reward
    norm_rate.svg -- normalization not identified; Passive dendrites nRew vs. nHIT early reward ev_onset.svg
    -- ROI count matches but the passive-dendrite event set differs'
states:
- run_id: v10-reward-rate-mannwhitney-active-pd62
  alignment: reward
  epochs:
  - name: early reward
    default_window: [5.1, 6.1]
    per_protocol:
      NO_DREADDs: [5.05, 5.8]
      passive_dendrites: [5.1, 6.2]
  modulation:
    epoch: early reward
    threshold: median
  comparisons:
  - name: NO_DREADDs cHIT vs. nHIT
    a: [NO_DREADDs, cHIT]
    b: [NO_DREADDs, nHIT]
    metric: rate
    epoch: early reward
    test: mannwhitney
    roi_set: active
    p_threshold: 1.5
    figure:
      figsize: [1.585, 2.0]
      ylim: [0.0, 1.0]
  - name: Passive dendrites cRew vs. cHIT
    a: [passive_dendrites, cRew]
    b: [NO_DREADDs, cHIT]
    metric: rate
    epoch: early reward
    test: mannwhitney
    roi_set: active
    p_threshold: 1.0
    figure:
      figsize: [1.585, 2.0]
      ylim: [0.0, 1.05]
  - name: Passive dendrites cRew vs. cHIT
    a: [passive_dendrites, cRew]
    b: [NO_DREADDs, cHIT]
    metric: rate
    epoch: early reward
    test: mannwhitney
    roi_set: active
    p_threshold: 1.0
    normalize:
      a_reference: [passive_dendrites, nRew]
      b_reference: [NO_DREADDs, nHIT]
    figure:
      figsize: [1.585, 2.0]
      ylim: [0.45, 4.05]
  - name: Passive dendrites cRew vs. nRew
    a: [passive_dendrites, cRew]
    b: [passive_dendrites, nRew]
    metric: rate
    epoch: early reward
    test: mannwhitney
    roi_set: active
    p_threshold: 1.5
    figure:
      figsize: [1.585, 2.0]
      ylim: [0.0, 1.0]
